<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Study Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: #f5f6fa; --surface: #fff; --text: #1f2430; --muted: #6b7280;
        --border: #e2e5ee; --accent: #4f46e5; --accent-hover: #4338ca; --danger: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14161d; --surface: #1d2029; --text: #e8eaf0; --muted: #9aa1b2;
          --border: #2d3140; --accent: #818cf8; --accent-hover: #a5b4fc; --danger: #f87171;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--text);
        font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .site-header { background: var(--surface); border-bottom: 1px solid var(--border); }
      .site-header .inner, main { max-width: 760px; margin: 0 auto; padding: 0 16px; }
      .site-header .inner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding-top: 12px; padding-bottom: 12px; }
      .brand { font-size: 1.2rem; font-weight: 700; margin: 0; }
      .brand a { color: var(--text); text-decoration: none; }
      nav { display: flex; flex-wrap: wrap; gap: 4px 16px; }
      nav a { color: var(--muted); text-decoration: none; font-weight: 500; }
      nav a:hover { color: var(--accent); }
      main { padding-top: 24px; padding-bottom: 48px; }
      h1, h2, h3 { line-height: 1.25; margin: 1.4em 0 .5em; }
      h1:first-child, h2:first-child { margin-top: 0; }
      a { color: var(--accent); }
      a:hover { color: var(--accent-hover); }
      ul { padding-left: 0; list-style: none; }
      main li {
        background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
        padding: 12px 16px; margin-bottom: 10px;
      }
      main li p { margin: 4px 0 0; color: var(--muted); }
      form { margin: 0 0 16px; }
      label { display: block; font-weight: 600; margin: 10px 0 4px; font-size: .9rem; }
      input[type=text] {
        width: 100%; padding: 8px 10px; font: inherit; color: var(--text);
        background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      }
      input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
      button {
        font: inherit; font-weight: 600; cursor: pointer; margin-top: 10px;
        padding: 8px 16px; color: #fff; background: var(--accent);
        border: 0; border-radius: 8px;
      }
      button:hover { background: var(--accent-hover); }
      form[action$="/delete"] { display: inline; }
      form[action$="/delete"] button {
        margin: 0 0 0 8px; padding: 2px 10px; font-size: .85rem;
        background: transparent; color: var(--danger); border: 1px solid var(--danger);
      }
      form[action$="/delete"] button:hover { background: var(--danger); color: #fff; }
      .study-card {
        background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
        padding: 20px 24px; margin: 16px 0; font-size: 1.15rem;
      }
      .study-card p:first-child, .study-card p:nth-child(3) { color: var(--muted); font-size: .85rem; margin-bottom: 0; text-transform: uppercase; letter-spacing: .04em; }
      fieldset { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); padding: 12px 16px; }
      fieldset label { display: inline-flex; align-items: center; gap: 6px; font-weight: 400; margin-right: 14px; }
      .overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 8px; }
      .overview p {
        margin: 0; padding: 14px 16px; background: var(--surface);
        border: 1px solid var(--border); border-radius: 10px; color: var(--muted); font-size: .9rem;
      }
      table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
      th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); }
      th { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
      tr:last-child td { border-bottom: 0; }
      hr { display: none; }
      section + section { margin-top: 28px; }
      h1, h2, h3 { font-weight: 700; }
    </style>
  </head>
  <body>
    <header class="site-header"><div class="inner">
    <p class="brand"><a href="/decks">Study Tracker</a></p>
    <nav>
      <a href="/decks">Decks</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/decks/newest">Newest deck</a>
      <a href="/tags">Tags</a>
      <a href="/tags/newest">Newest tag</a>
    </nav>
    </div></header>
    <main>
    {% block content %}{% endblock %}
    </main>
  </body>
</html>
