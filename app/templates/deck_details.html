<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ deck.name }} - Details</title>
  </head>
  <body>
    <h1>{{ deck.name }}</h1>
    <p>{{ deck.description }}</p>
    <a href="/decks">Back to Decks</a>

    <h3>Add New Card</h3>
    <form action="/decks/{{ deck.id }}/cards" method="post">
      <input type="text" name="front" placeholder="Front Side (Question)" required>
      <input type="text" name="back" placeholder="Back Side (Answer)" required>
      <button type="submit">Add Card</button>
    </form>

    <h3>Cards in this Deck</h3>
    {% if cards %}
      <table border="1">
        <thead>
          <tr>
            <th>Front</th>
            <th>Back</th>
          </tr>
        </thead>
        <tbody>
          {% for card in cards %}
            <tr>
              <td>{{ card.front }}</td>
              <td>{{ card.back }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p>No cards in this deck yet.</p>
    {% endif %}
  </body>
</html>
