{% extends "base.html" %}
{% block content %}
    <h2>{{ deck.name }}</h2>
    <p>{{ deck.description }}</p>
    <p><a href="/decks">Back to Decks</a></p>

    <h3>Add New Card</h3>
    <form action="/decks/{{ deck.id }}/cards" method="post">
      <label for="question">Question</label>
      <input type="text" id="question" name="question" required>

      <label for="answer">Answer</label>
      <input type="text" id="answer" name="answer" required>

      <button type="submit">Add Card</button>
    </form>

    <h3>Cards in this Deck</h3>
    {% if cards %}
      <table border="1">
        <thead>
          <tr>
            <th>Question</th>
            <th>Answer</th>
          </tr>
        </thead>
        <tbody>
          {% for card in cards %}
            <tr>
              <td>{{ card.question }}</td>
              <td>{{ card.answer }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p>No cards yet.</p>
    {% endif %}
{% endblock %}
