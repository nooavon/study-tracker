services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: studytracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studytracker"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/studytracker
      DEV_RELOAD: "1"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
